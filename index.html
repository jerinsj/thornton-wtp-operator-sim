<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thornton WTP Operator Simulator V16</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#11161b;color:#eef2f5;font:14px "Segoe UI Variable Text",Inter,"Segoe UI",Roboto,Arial,sans-serif}
    .loader{max-width:620px;padding:28px;text-align:center}.loader b{display:block;font-size:18px;margin-bottom:8px}.loader span{color:#a4b0b9;line-height:1.5}.err{color:#ff9b9b;margin-top:14px}
  </style>
  <script src="app/patch-v12.js?v=12"></script>
  <script src="app/patch-v13.js?v=13"></script>
  <script src="app/patch-v14.js?v=14"></script>
  <script src="app/patch-v16.js?v=16"></script>
</head>
<body>
  <div class="loader"><b>Loading Thornton WTP Operator Simulator V16…</b><span>Interactive SCADA-style training simulation with Start / Resume / Scenario modes, animated schematics, randomized shifts, dynamic chemistry and PFAS GAC. Not an actual control system.</span><div class="err" id="err"></div></div>
  <script>
    (async()=>{
      const parts=Array.from({length:10},(_,i)=>`app/parts/part-${String(i).padStart(2,'0')}.txt`);
      const heroFiles=[
        'assets/home/hero-0.txt','assets/home/hero-1.txt','assets/home/hero-2.txt','assets/home/hero-3.txt',
        'assets/home/hero-4.txt','assets/home/hero-5.txt','assets/home/hero-6-fixed.txt','assets/home/hero-7.txt'
      ];
      try{
        const [responses,heroResponses]=await Promise.all([
          Promise.all(parts.map(p=>fetch(p))),
          Promise.all(heroFiles.map(p=>fetch(p)))
        ]);
        const failed=responses.findIndex(r=>!r.ok);
        if(failed>=0) throw new Error(`Could not load simulator bundle part ${failed+1}.`);
        const heroFailed=heroResponses.findIndex(r=>!r.ok);
        if(heroFailed>=0) throw new Error(`Could not load home image part ${heroFailed+1}.`);
        let source=(await Promise.all(responses.map(r=>r.text()))).join('');
        const heroBase64=(await Promise.all(heroResponses.map(r=>r.text()))).join('').replace(/\s/g,'');
        if(typeof patchSimulatorSource!=='function') throw new Error('V12 patch module did not load.');
        if(typeof patchSimulatorSourceV13!=='function') throw new Error('V13 chemistry patch module did not load.');
        if(typeof patchSimulatorSourceV14!=='function') throw new Error('V14 theme patch module did not load.');
        if(typeof patchSimulatorSourceV16!=='function') throw new Error('V16 interactive HMI patch module did not load.');
        source=patchSimulatorSource(source);
        source=patchSimulatorSourceV13(source);
        source=patchSimulatorSourceV14(source);
        source=patchSimulatorSourceV16(source);
        const heroCSS=`
          .v16-panel{width:min(1180px,96vw);max-height:94vh;grid-template-columns:1fr;overflow:auto}
          .v16-photo{min-height:0;background:#0e1317;overflow:hidden;border-radius:18px 18px 0 0}
          .v16-photo img{display:block;width:100%;height:auto;min-height:0;max-height:none;object-fit:contain;object-position:center center}
          .v16-copy{padding:18px 24px 22px}
          .v16-copy h1{font-size:30px;margin:6px 0 8px}
          .v16-copy p{margin:0 0 8px;max-width:980px}
          .v16-meta{margin:8px 0}.v16-actions{margin:8px 0}
          @media(max-height:760px) and (min-width:851px){
            .v16-photo img{max-height:340px;object-fit:cover;object-position:center center}
            .v16-copy{padding:14px 22px 18px}.v16-copy p{font-size:13px;line-height:1.4}
          }
          @media(max-width:850px){.v16-photo img{max-height:none;object-fit:contain}.v16-copy{padding:16px}}
        `;
        source=source.replace('</style>',heroCSS+'\n</style>');
        source=source.replace('<img id="v16Photo" alt="Thornton Water Treatment Plant site view">',`<img id="v16Photo" alt="Thornton Water Treatment Plant aerial site view" src="data:image/jpeg;base64,${heroBase64}">`);
        document.open();
        document.write(source);
        document.close();
      }catch(err){
        document.getElementById('err').textContent='Unable to load the simulator. Serve this repository through GitHub Pages or another HTTP static server. '+err.message;
      }
    })();
  </script>
</body>
</html>
