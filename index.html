<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thornton WTP Operator Simulator V16.8 TEST</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#11161b;color:#eef2f5;font:14px "Segoe UI Variable Text",Inter,"Segoe UI",Roboto,Arial,sans-serif}
    .loader{max-width:620px;padding:28px;text-align:center}.loader b{display:block;font-size:18px;margin-bottom:8px}.loader span{color:#a4b0b9;line-height:1.5}.err{color:#ff9b9b;margin-top:14px}
  </style>
  <script src="app/patch-v12.js?v=12.1"></script>
  <script src="app/patch-v13.js?v=13"></script>
  <script src="app/patch-v14.js?v=14"></script>
  <script src="app/patch-v16.js?v=16"></script>
  <script src="app/patch-v16-controls.js?v=16.1.2"></script>
  <script src="app/patch-v16-tasks.js?v=16.2"></script>
  <script src="app/patch-v16-home-image.js?v=16.3"></script>
  <script src="app/patch-v16-scada-branch.js?v=16.5-test"></script>
  <script src="app/patch-v16-valve-consequences.js?v=16.6-test"></script>
  <script src="app/patch-v16-strict-scoring.js?v=16.7-test"></script>
  <script src="app/patch-v16-process-status.js?v=16.8-test"></script>
</head>
<body>
  <div class="loader"><b>Loading Thornton WTP Operator Simulator V16.8 TEST…</b><span>Interactive SCADA test build with live treatment-unit status, strict weakest-link scoring, valve-specific alarms and modeled consequences, routine tasks, and the direct local plant image. Not an actual control system.</span><div class="err" id="err"></div></div>
  <script>
    (async()=>{
      const parts=Array.from({length:10},(_,i)=>`app/parts/part-${String(i).padStart(2,'0')}.txt`);
      try{
        const responses=await Promise.all(parts.map(p=>fetch(p)));
        const failed=responses.findIndex(r=>!r.ok);
        if(failed>=0) throw new Error(`Could not load simulator bundle part ${failed+1}.`);
        let source=(await Promise.all(responses.map(r=>r.text()))).join('');
        if(typeof patchSimulatorSource!=='function') throw new Error('V12 patch module did not load.');
        if(typeof patchSimulatorSourceV13!=='function') throw new Error('V13 chemistry patch module did not load.');
        if(typeof patchSimulatorSourceV14!=='function') throw new Error('V14 theme patch module did not load.');
        if(typeof patchSimulatorSourceV16!=='function') throw new Error('V16 interactive HMI patch module did not load.');
        if(typeof patchSimulatorSourceV16Controls!=='function') throw new Error('V16.1 controls patch module did not load.');
        if(typeof patchSimulatorSourceV16Tasks!=='function') throw new Error('V16.2 task-board patch module did not load.');
        if(typeof patchSimulatorSourceV16HomeImage!=='function') throw new Error('V16.3 home-image patch module did not load.');
        if(typeof patchSimulatorSourceV16ScadaBranch!=='function') throw new Error('V16.5 branch SCADA patch module did not load.');
        if(typeof patchSimulatorSourceV16ValveConsequences!=='function') throw new Error('V16.6 valve consequence patch module did not load.');
        if(typeof patchSimulatorSourceV16StrictScoring!=='function') throw new Error('V16.7 strict scoring patch module did not load.');
        if(typeof patchSimulatorSourceV16ProcessStatus!=='function') throw new Error('V16.8 process status patch module did not load.');
        source=patchSimulatorSource(source);
        source=patchSimulatorSourceV13(source);
        source=patchSimulatorSourceV14(source);
        source=patchSimulatorSourceV16(source);
        source=patchSimulatorSourceV16Controls(source);
        source=patchSimulatorSourceV16Tasks(source);
        source=patchSimulatorSourceV16HomeImage(source);
        source=patchSimulatorSourceV16ScadaBranch(source);
        source=patchSimulatorSourceV16ValveConsequences(source);
        source=patchSimulatorSourceV16StrictScoring(source);
        source=patchSimulatorSourceV16ProcessStatus(source);
        document.open();
        document.write(source);
        document.close();
      }catch(err){
        document.getElementById('err').textContent='Unable to load the simulator. '+err.message;
      }
    })();
  </script>
</body>
</html>
